<!-- Canonical expanded chart for every screen and viewport. -->
<div class="modal-backdrop chart-modal" id="chart-modal" role="dialog" aria-modal="true" aria-labelledby="chart-modal-title">
  <div class="modal-card">
    <div class="modal-header">
      <h2 class="modal-title" id="chart-modal-title"></h2>
      <div class="chart-view-action">
        <button type="button" id="chart-view-toggle" aria-controls="chart-news-panel" aria-pressed="false">
          <span id="chart-view-label">Get News</span>
          <svg viewBox="0 0 12 12" aria-hidden="true"><path d="m3 4.5 3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="price-block chart-modal-price" id="chart-modal-price">
        <span class="price-val" data-role="modal-price">--</span>
        <span class="price-chg" data-role="modal-change">--</span>
      </div>
      <div class="chart-toolbar">
        <button type="button" class="chart-tool-btn support" id="chart-draw-support">
          <svg viewBox="0 0 12 12" fill="none"><path d="M6 10V2M3 5l3-3 3 3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Draw S/R
        </button>
        <button type="button" class="chart-tool-btn clear" id="chart-clear-lines">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4 5.5h12m-9-2h6m-7.5 2 .7 11h7.6l.7-11M8 8.5v5m4-5v5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Clear All
        </button>
        <button type="button" class="chart-tool-btn live-15m" id="live-15m-toggle" title="Live — Show intraday candles">
          <svg viewBox="0 0 12 12" fill="none">
            <circle cx="6" cy="6" r="4" stroke="currentColor" stroke-width="1.2"/>
            <path d="M6 3v3l2 1.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
          </svg>
          Live
        </button>
        <button type="button" class="chart-tool-btn vp" id="vp-toggle" title="Volume Profile — Show price-distribution histogram" aria-label="Volume Profile" aria-pressed="false">
          <svg viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M2 2v8M4.5 4v6M7 1v10M9.5 5v4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
          <span>VP</span>
        </button>
        <button type="button" class="chart-tool-btn tv-widget" id="tv-widget-toggle" title="TradingView — Open live TradingView chart widget">
          <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <rect x="2.5" y="3" width="15" height="14" rx="2.5" stroke="currentColor" stroke-width="1.7"/>
            <path d="m5.5 13 3-3 2 1.5 4-5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          TradingView
        </button>
        <button type="button" class="chart-tool-btn pnl-chart" id="pnl-chart-toggle" title="P/L — Show unrealized profit over time">
          <svg viewBox="0 0 12 12" fill="none">
            <path d="M2 10L5 6 8 8 11 3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          P/L
        </button>
        <button type="button" class="chart-tool-btn trailing-stop" id="chart-trailing-stop" aria-pressed="false" title="Place a daily-close trailing stop for this portfolio">
          <svg viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M1 9h3V7h3V5h4M2 3l3 1 3-2 3 1" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Trailing Stop
        </button>
      </div>
      <button type="button" class="modal-close" id="chart-modal-close" aria-label="Close chart">
        <svg viewBox="0 0 18 18" fill="none"><path d="M4 4l10 10M14 4L4 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <section id="chart-news-panel" aria-label="Recent ticker news" hidden tabindex="0">
        <div class="chart-news-heading">
          <h3 id="chart-news-title">News · Last 8 hours</h3>
          <span id="chart-news-updated"></span>
        </div>
        <p id="chart-news-status" role="status" aria-live="polite"></p>
        <div id="chart-news-items"></div>
      </section>
      <div class="chart-modal-body">
        <div class="chart-area">
          <div id="chart-canvas" style="width:100%;position:relative;"></div>
          <div class="vp-control-row" id="vp-control-row" hidden>
            <div class="vp-range-group" role="group" aria-label="Chart range and volume profile period">
              <button type="button" class="vp-range-btn" data-vp-range="1w">1W</button>
              <button type="button" class="vp-range-btn" data-vp-range="1m">1M</button>
              <button type="button" class="vp-range-btn" data-vp-range="3m">3M</button>
              <button type="button" class="vp-range-btn" data-vp-range="6m">6M</button>
              <button type="button" class="vp-range-btn" data-vp-range="1y">1Y</button>
            </div>
            <button type="button" class="vp-anchor-btn" id="vp-anchor-btn" aria-pressed="false">Anchor</button>
            <span class="vp-context" id="vp-context" role="status"></span>
          </div>
          <div class="chart-pattern-row" id="chart-pattern-row" hidden>
            <span id="chart-pattern-label" role="status"></span>
            <button type="button" id="chart-pattern-toggle" aria-pressed="true" aria-label="Hide pattern overlay" aria-describedby="chart-pattern-label" title="Hide pattern">
              <span class="chart-pattern-action">Hide</span>
              <svg class="eye-open" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M2 10s3-5 8-5 8 5 8 5-3 5-8 5-8-5-8-5Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="10" cy="10" r="2.3" stroke="currentColor" stroke-width="1.4"/></svg>
              <svg class="eye-closed" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3 7.4C4.5 6 6.8 5 10 5c5 0 8 5 8 5-.6 1-1.4 2-2.5 2.9M4.5 13C2.9 11.6 2 10 2 10m5.2 4.5A9 9 0 0 0 10 15c1.1 0 2.1-.2 3-.5M2.5 2.5l15 15" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <div class="chart-avg-badge" id="chart-avg-badge" style="position:absolute;right:var(--space-4);top:60px;display:none;">Avg: $0.00</div>
        </div>
        <div class="chart-legend-panel">
          <div class="chart-legend-title">Support / Resistance Lines</div>
          <div id="chart-sr-legend"></div>
          <section id="chart-ts-section" hidden aria-labelledby="chart-ts-title">
            <div class="chart-legend-title" id="chart-ts-title" tabindex="-1">Trailing Stop</div>
            <div class="ts-help ts-status" id="chart-ts-status" role="status"></div>
            <div class="ts-details" id="chart-ts-details"></div>
            <form class="ts-editor" id="chart-ts-editor" hidden>
              <label class="position-form-label" for="chart-ts-price">Stop price</label>
              <input class="position-form-input" id="chart-ts-price" type="number" min="0.01" step="0.01" inputmode="decimal" required aria-describedby="chart-ts-reference chart-ts-distance chart-ts-error">
              <div class="ts-help" id="chart-ts-reference"></div>
              <div class="ts-help" id="chart-ts-distance"></div>
              <div class="ts-help" id="chart-ts-effective"></div>
              <div class="ts-help ts-error" id="chart-ts-error" role="alert"></div>
              <div class="ts-actions">
                <button type="button" class="chart-tool-btn clear" id="chart-ts-cancel">Cancel</button>
                <button type="submit" class="chart-tool-btn trailing-stop" id="chart-ts-save">Save</button>
              </div>
            </form>
          </section>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="sr-picker" id="chartSRPicker" role="dialog" aria-label="Choose line type" style="display:none;">
  <span class="sr-picker-price" id="chartSRPickerPrice"></span>
  <button type="button" class="sr-picker-btn sup" id="chartSRPickerSupport">Support</button>
  <button type="button" class="sr-picker-btn res" id="chartSRPickerResistance">Resistance</button>
  <button type="button" class="sr-picker-cancel" id="chartSRPickerCancel" aria-label="Cancel">&times;</button>
</div>
