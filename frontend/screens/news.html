<!-- ═══════════════════════════════════════════════════════
     NEWS — Movers digest (Finviz-style, grouped by mover)
     ═══════════════════════════════════════════════════════ -->
<style>
  /* ─── Shared app layout (ported from transactions.html — these classes
         live per-screen, not in global styles.css) ─── */
  .page-header { display:flex; align-items:center; justify-content:space-between;
    margin-bottom:var(--space-5); flex-wrap:wrap; gap:var(--space-3); }
  .page-title { font-size:var(--font-size-2xl); font-weight:var(--font-weight-bold);
    color:var(--color-text-primary); letter-spacing:-0.01em; }
  .page-subtitle { font-size:var(--font-size-sm); color:var(--color-text-secondary);
    font-weight:var(--font-weight-medium); }
  .page-meta { display:flex; align-items:center; gap:var(--space-3);
    font-size:var(--font-size-sm); color:var(--color-text-secondary);
    font-family:var(--font-mono); font-size:var(--font-size-xs); }
  .stats-bar { display:flex; align-items:center; gap:var(--space-5);
    padding:var(--space-3) var(--space-5); background:var(--color-bg-elevated);
    border:1px solid var(--color-border); border-radius:var(--radius-md);
    margin-bottom:var(--space-5); overflow-x:auto; white-space:nowrap;
    font-family:var(--font-mono); }
  .stats-bar-item { display:flex; flex-direction:column; gap:2px; }
  .stats-bar-label { font-size:var(--font-size-xs); color:var(--color-text-secondary);
    font-weight:var(--font-weight-medium); text-transform:uppercase; letter-spacing:0.4px; }
  .stats-bar-value { font-size:var(--font-size-base); font-weight:var(--font-weight-semibold);
    font-family:var(--font-mono); color:var(--color-text-primary); }
  .stats-bar-value.up { color:var(--color-stock-up); }
  .stats-bar-value.down { color:var(--color-stock-down); }
  .stats-bar-divider { width:1px; height:28px; background:var(--color-divider); flex-shrink:0; }
  .ranking-panel { background:var(--color-bg-elevated); border:1px solid var(--color-divider);
    border-radius:var(--radius-md); overflow:hidden; margin-bottom:var(--space-6); }
  .ranking-panel:hover { box-shadow:var(--shadow-sm); }
  .panel-header { display:flex; align-items:center; justify-content:space-between;
    padding:var(--space-4) var(--space-5); border-bottom:1px solid var(--color-divider); }
  .panel-title-group { display:flex; align-items:center; gap:var(--space-3); }
  .panel-title { font-size:var(--font-size-md); font-weight:var(--font-weight-semibold);
    color:var(--color-text-primary); }
  .panel-count { font-size:var(--font-size-sm); font-weight:var(--font-weight-semibold);
    color:var(--color-text-tertiary); font-family:var(--font-mono); }
  .ranking-table { width:100%; font-size:13px; }
  .ranking-table thead th { padding:var(--space-2) var(--space-3); text-align:left;
    font-family:var(--font-mono); font-size:10px; font-weight:var(--font-weight-semibold);
    color:var(--color-text-tertiary); text-transform:uppercase; letter-spacing:0.1em;
    background:var(--color-bg-inset); border-bottom:1px solid var(--color-divider);
    white-space:nowrap; }
  .ranking-table tbody tr { border-bottom:1px solid var(--color-divider);
    transition:background var(--duration-fast); }
  .ranking-table tbody tr:last-child { border-bottom:none; }
  .ranking-table tbody tr:hover { background:var(--color-bg-inset); }
  .ranking-table td { padding:var(--space-2) var(--space-3); vertical-align:middle;
    font-variant-numeric:tabular-nums; }
  .ticker-cell { font-weight:var(--font-weight-bold); font-family:var(--font-mono);
    color:var(--color-text-primary); font-size:var(--font-size-sm); }
  .btn-ghost { display:inline-flex; align-items:center; gap:var(--space-2);
    padding:var(--space-3) var(--space-5); background:transparent;
    color:var(--color-text-secondary); font-size:var(--font-size-sm);
    font-weight:var(--font-weight-semibold); border-radius:var(--radius-sm);
    border:1px solid var(--color-border); transition:all var(--duration-fast); cursor:pointer; }
  .btn-ghost:hover { background:var(--color-bg-subtle); color:var(--color-text-primary); }
  .btn-ghost:disabled { opacity:0.5; cursor:wait; }
  .empty-state { display:none; flex-direction:column; align-items:center; justify-content:center;
    padding:var(--space-12) var(--space-6); text-align:center;
    font-size:var(--font-size-sm); color:var(--color-text-secondary); }
  .empty-state.visible { display:flex; }
  .error-banner { display:none; align-items:center; gap:var(--space-3);
    padding:var(--space-3) var(--space-5); background:rgba(255,59,48,0.08);
    border:1px solid rgba(255,59,48,0.2); border-radius:var(--radius-md);
    margin-bottom:var(--space-4); font-size:var(--font-size-sm); color:var(--color-error); }
  .error-banner.visible { display:flex; }
  @media (max-width:767px) {
    .page-header { flex-direction:column; align-items:flex-start; }
    .ranking-table { font-size:var(--font-size-xs); }
    .ranking-table td, .ranking-table th { padding:var(--space-2) var(--space-3); }
    .stats-bar { gap:var(--space-4); padding:var(--space-3) var(--space-4); }
    .panel-header { flex-wrap:wrap; gap:var(--space-1) var(--space-3); }
    .panel-title-group { min-width:0; flex:1 1 auto; }
    .panel-title { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .panel-count { flex:1 1 100%; text-align:left; margin-top:1px;
      font-size:var(--font-size-xs); font-weight:var(--font-weight-medium); }
  }
  @media (max-width:480px) { .hide-mobile { display:none; } }
  @media (prefers-reduced-motion:reduce) {
    *, *::before, *::after { animation-duration:0.01ms !important; transition-duration:0.01ms !important; }
  }

  /* ─── News-specific ─── */
  .news-meta { display:flex; gap:8px; align-items:center; font-family:var(--font-mono);
    font-size:11px; color:var(--color-text-secondary); }
  .news-meta .dot { color:var(--color-text-tertiary); }
  .news-meta .dot { color:var(--color-text-tertiary); }
  .news-toolbar { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; align-items:center; }
  .news-chip { font-family:var(--font-mono); font-size:11px; border:1px solid var(--color-border);
    background:var(--color-bg-elevated); border-radius:9999px; padding:5px 12px;
    cursor:pointer; color:var(--color-text-secondary); }
  .news-chip.active { background:var(--color-primary); color:var(--color-bg); border-color:var(--color-primary); }
  .news-tool-btn { font-family:var(--font-mono); font-size:11px;
    border:1px dashed var(--color-border-strong); background:transparent;
    border-radius:9999px; padding:5px 12px; cursor:pointer; color:var(--color-text-secondary); }
  .news-search { font-family:var(--font-mono); font-size:12px; border:1px solid var(--color-border);
    background:var(--color-bg-elevated); color:var(--color-text-primary);
    border-radius:var(--radius-sm); padding:6px 10px; min-width:220px; }
  .news-dateline { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; align-items:center; }
  .news-date-pill { font-family:var(--font-mono); font-size:11px; border:1px solid var(--color-border);
    background:var(--color-bg-elevated); border-radius:9999px; padding:5px 12px;
    color:var(--color-text-secondary); cursor:pointer; }
  .news-date-pill.active { background:var(--color-primary); color:var(--color-bg); border-color:var(--color-primary); }
  .news-mover { border-bottom:1px solid var(--color-divider); }
  .news-mover:last-child { border-bottom:0; }
  .news-mover summary { list-style:none; display:flex; align-items:center; gap:10px;
    padding:10px 16px; cursor:pointer; background:var(--color-bg-elevated); }
  .news-mover summary::-webkit-details-marker { display:none; }
  .news-mover summary:hover { background:var(--color-bg-inset); }
  .news-company { color:var(--color-text-secondary); font-size:12px; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; max-width:280px; }
  .news-move-badge { font-family:var(--font-mono); font-size:11px; font-weight:600;
    padding:2px 8px; border-radius:4px; }
  .news-move-badge.up { background:var(--color-success-subtle); color:var(--color-success); }
  .news-move-badge.down { background:var(--color-error-subtle); color:var(--color-error); }
  .news-last { margin-left:auto; font-family:var(--font-mono); font-size:12px;
    color:var(--color-text-secondary); }
  .news-count { font-family:var(--font-mono); font-size:11px; color:var(--color-text-tertiary); }
  .news-time { font-family:var(--font-mono); font-size:11px; white-space:nowrap; }
  .news-age { display:block; color:var(--color-text-tertiary); font-size:10px; }
  .news-headline a { color:var(--color-text-primary); text-decoration:none; }
  .news-headline a:hover { text-decoration:underline; }
  .news-headline a:visited { color:var(--color-text-secondary); }
  .news-src { font-family:var(--font-mono); font-size:10px; text-transform:uppercase;
    letter-spacing:.06em; border:1px solid var(--color-border); border-radius:4px;
    padding:2px 7px; color:var(--color-text-secondary); white-space:nowrap; }
  .news-empty-row td { color:var(--color-text-tertiary); font-size:12px; }
  @media (max-width:767px) {
    .news-toolbar { display:grid; grid-template-columns:repeat(6, minmax(0, 1fr)); }
    .news-toolbar .news-chip { grid-column:span 2; }
    .news-toolbar .news-tool-btn { grid-column:span 3; }
    .news-toolbar .news-search { grid-column:1 / -1; min-width:0; width:100%; }
  }
  @media (max-width:640px) {
    .news-meta { display:grid; grid-template-columns:1fr auto; gap:2px 10px; width:100%; }
    .news-meta .dot { display:none; }
    .news-toolbar .news-search { flex:1 1 100%; min-width:0; }
    .news-search { font-size:16px; min-height:44px; }
    .news-company { max-width:140px; }
    .news-mover summary { flex-wrap:wrap; row-gap:2px; }
    .news-last { margin-left:0; }
  }
</style>

<header class="page-header">
  <div>
    <h1 class="page-title">News</h1>
    <p class="page-subtitle">Movers digest — Finviz-style headlines grouped by mover</p>
  </div>
  <div class="page-meta news-meta">
    <span id="news-meta-updated">Updated —</span><span class="dot">·</span>
    <span id="news-meta-window">Window 12h</span><span class="dot">·</span>
    <span id="news-meta-universe">Universe —</span><span class="dot">·</span>
    <button class="btn-ghost" id="news-refresh-btn">Refresh</button>
  </div>
</header>

<div class="stats-bar" id="news-stats">
  <div class="stats-bar-item"><div class="stats-bar-label">Movers</div><div class="stats-bar-value" id="news-stat-movers">—</div></div>
  <div class="stats-bar-divider"></div>
  <div class="stats-bar-item"><div class="stats-bar-label">Up</div><div class="stats-bar-value up" id="news-stat-up">—</div></div>
  <div class="stats-bar-divider"></div>
  <div class="stats-bar-item"><div class="stats-bar-label">Down</div><div class="stats-bar-value down" id="news-stat-down">—</div></div>
  <div class="stats-bar-divider"></div>
  <div class="stats-bar-item"><div class="stats-bar-label">Stories</div><div class="stats-bar-value" id="news-stat-stories">—</div></div>
  <div class="stats-bar-divider"></div>
  <div class="stats-bar-item"><div class="stats-bar-label">Coverage</div><div class="stats-bar-value" id="news-stat-coverage">—</div></div>
</div>

<div class="news-toolbar" role="group" aria-label="News filters">
  <button class="news-chip active" data-f="all" aria-pressed="true">All</button>
  <button class="news-chip" data-f="up" aria-pressed="false">Up</button>
  <button class="news-chip" data-f="down" aria-pressed="false">Down</button>
  <button class="news-tool-btn" id="news-expand-btn">Expand all</button>
  <button class="news-tool-btn" id="news-collapse-btn">Collapse all</button>
  <input type="search" class="news-search" id="news-search" placeholder="Search ticker…" aria-label="Search ticker in this digest" enterkeyhint="search" autocapitalize="none" autocorrect="off" spellcheck="false">
</div>

<div class="news-dateline" id="news-dateline" aria-label="Digest history"></div>

<section class="ranking-panel" aria-label="Movers news">
  <div class="panel-header">
    <div class="panel-title-group">
      <div>
        <div class="panel-title" id="news-panel-title">Top movers</div>
      </div>
    </div>
    <span class="panel-count" id="news-count">0 movers</span>
  </div>
  <div style="position: relative; overflow-x: auto;">
    <div id="news-groups"><!-- Populated by JS module --></div>
    <div id="news-no-results" class="empty-state" role="status" aria-live="polite">No matching ticker in this digest. Try another ticker or select All.</div>
  </div>
</section>
<div class="error-banner" id="news-error" hidden></div>
