<!-- ═══════════════════════════════════════════════════════
     Charts Screen — Multi-chart grid with tabs, S/R drawing
     Loaded by App.loadScreen('charts')
     ═══════════════════════════════════════════════════════ -->
<style>
  /* ── Chart Tabs (Watchlist tabs below main nav) ── */
  .chart-tabs {
    position: sticky;
    top: var(--nav-height);
    left: 0;
    right: 0;
    height: 40px;
    background: var(--color-bg);
    display: flex;
    align-items: center;
    padding: 0 var(--space-4);
    gap: var(--space-2);
    z-index: 90;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .chart-tabs::-webkit-scrollbar { display: none; }

  .tab-pill {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    padding: 6px var(--space-3);
    border-radius: var(--radius-full);
    border: 1px solid var(--color-border);
    background: var(--color-bg-elevated);
    font-size: var(--font-size-sm);
    font-weight: var(--font-weight-medium);
    color: var(--color-text-secondary);
    white-space: nowrap;
    transition: all var(--duration-normal) var(--ease-out);
    cursor: pointer;
    flex-shrink: 0;
  }
  .tab-pill:hover { background: var(--color-primary-subtle); border-color: var(--color-primary); color: var(--color-primary); }
  .tab-pill.active { background: var(--color-primary); border-color: var(--color-primary); color: var(--color-text-inverse); }

  .tab-name {
    max-width: 120px;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .tab-select {
    display: inline-flex;
    align-items: center;
    min-width: 0;
    font: inherit;
    color: inherit;
    letter-spacing: inherit;
    touch-action: manipulation;
  }

  .tab-rename, .tab-close {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    border-radius: var(--radius-full);
    visibility: hidden;
    pointer-events: none;
    opacity: 0;
    transition: opacity var(--duration-fast) var(--ease-out);
    font-size: 10px;
  }
  /* Reveal only after selection, never on hover (which can consume an iOS tap).
     Preserve each tab's width while hiding inactive actions from focus/hit testing. */
  .tab-pill.active .tab-rename, .tab-pill.active .tab-close {
    visibility: visible;
    pointer-events: auto;
    opacity: 0.7;
  }
  @media (hover: hover) and (pointer: fine) {
    .tab-pill.active .tab-rename:hover, .tab-pill.active .tab-close:hover { opacity: 1; }
    .tab-pill.active .tab-rename:hover,
    .tab-pill.active .tab-close:hover { background: rgba(255,255,255,0.2); }
  }

  .tab-add {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6px var(--space-3);
    border-radius: var(--radius-full);
    font-size: var(--font-size-sm);
    font-weight: var(--font-weight-medium);
    color: var(--color-text-tertiary);
    border: 1px dashed var(--color-border);
    transition: all var(--duration-normal) var(--ease-out);
    white-space: nowrap;
    cursor: pointer;
    flex-shrink: 0;
  }
  .tab-add:hover {
    border-color: var(--color-primary);
    color: var(--color-primary);
    background: var(--color-primary-subtle);
  }

  /* ── Main Content Area ── */
  .chart-main {
    padding: var(--space-4);
    overflow-y: auto;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  /* ── Toolbar ── */
  .chart-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: var(--space-4);
    flex-wrap: wrap;
    gap: var(--space-3);
  }
  .toolbar-left, .toolbar-right {
    display: flex;
    align-items: center;
    gap: var(--space-3);
  }
  .toolbar-left { flex-wrap: wrap; }
  .chart-count {
    font-size: var(--font-size-sm);
    font-weight: var(--font-weight-medium);
    color: var(--color-text-secondary);
  }

  .add-chart-btn {
    display: inline-flex;
    align-items: center;
    gap: var(--space-2);
    padding: var(--space-2) var(--space-3);
    background: var(--color-primary);
    color: var(--color-text-inverse);
    font-size: var(--font-size-sm);
    font-weight: var(--font-weight-medium);
    border-radius: var(--radius-sm);
    transition: background var(--duration-fast) var(--ease-out);
    cursor: pointer;
    border: none;
  }
  .add-chart-btn:hover { background: var(--color-primary-hover); }
  .add-chart-btn:disabled { opacity: 0.6; cursor: wait; }

  /* ── Chart Grid ── */
  .chart-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    grid-auto-rows: minmax(300px, 1fr);
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding-bottom: var(--space-4);
  }
  @media (max-width: 1200px) { .chart-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 768px) { .chart-grid { grid-template-columns: 1fr; } }

  /* Holdings is one locked system tab with an in-tab portfolio selector. */
  #holdingsSelector[hidden], #tabAddBtn[hidden] { display: none; }
  .holdings-selector {
    display: flex; align-items: center; gap: var(--space-2); min-width: 0;
    margin-bottom: var(--space-4); border-bottom: 1px solid var(--color-divider);
  }
  .holdings-selector-label {
    font-family: var(--font-mono); font-size: 10px; font-weight: var(--font-weight-semibold);
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--color-text-tertiary); flex-shrink: 0;
  }
  .holdings-portfolio-tabs {
    display: flex; align-items: center; gap: var(--space-2); min-width: 0;
    overflow-x: auto; scrollbar-width: thin;
  }
  .holdings-portfolio-tab {
    display: inline-flex; align-items: center; gap: var(--space-2); flex-shrink: 0;
    min-height: 40px; padding: var(--space-2) 2px;
    border: 0; border-bottom: 2px solid transparent; border-radius: 0;
    background: none; color: var(--color-text-secondary); cursor: pointer;
    font-family: var(--font-mono); font-size: 12px; white-space: nowrap;
    transition: color var(--duration-fast), border-color var(--duration-fast);
  }
  .holdings-portfolio-tab:hover { color: var(--color-text-primary); background: none; border-color: transparent; }
  .holdings-portfolio-tab[aria-selected="true"] {
    border-bottom-color: var(--color-text-primary); color: var(--color-text-primary);
    font-weight: var(--font-weight-bold);
  }
  .holdings-portfolio-tab[aria-selected="true"] .holdings-currency { border-color: currentColor; color: inherit; }
  .holdings-currency {
    padding: 2px 5px; background: transparent; border: 1px solid var(--color-border); border-radius: 4px;
    font-family: var(--font-mono); font-size: 10px; font-weight: var(--font-weight-medium);
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-text-secondary);
  }
  .holdings-dropdown {
    display: none; width: 100%; min-width: 0; min-height: 44px; padding: 0 var(--space-3);
    background: var(--color-bg-elevated); color: var(--color-text-primary);
    border: 1px solid var(--color-border); border-radius: var(--radius-sm);
    font-family: var(--font-mono); font-size: var(--font-size-sm); font-weight: var(--font-weight-medium);
    cursor: pointer; align-items: center; justify-content: space-between; gap: var(--space-2);
  }
  .holdings-dropdown:focus { border-color: var(--color-text-primary); outline: none; box-shadow: 2px 2px 0 var(--color-text-primary); }
  .holdings-dropdown-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
  .holdings-dropdown .chevron { width: 14px; height: 14px; flex-shrink: 0; color: var(--color-text-secondary); transition: transform var(--duration-fast); }
  .holdings-dropdown[aria-expanded="true"] .chevron { transform: rotate(180deg); }
  .holdings-menu {
    position: absolute; top: calc(100% + var(--space-1)); left: 0; right: 0;
    max-height: 280px; overflow-y: auto; background: var(--color-bg-elevated);
    border: 1px solid var(--color-border); border-radius: var(--radius-md);
    box-shadow: var(--shadow-lg); z-index: 300; padding: var(--space-1);
  }
  .holdings-menu[hidden] { display: none; }
  .holdings-option {
    display: flex; align-items: center; gap: var(--space-2); width: 100%; min-width: 0;
    min-height: 44px; padding: var(--space-2) var(--space-3);
    background: none; border: 0; border-radius: var(--radius-sm); cursor: pointer;
    color: var(--color-text-secondary); font-family: var(--font-mono);
    font-size: var(--font-size-sm); font-weight: var(--font-weight-medium); text-align: left;
  }
  .holdings-option:hover { color: var(--color-text-primary); background: var(--color-bg-subtle); }
  .holdings-option[aria-selected="true"] { color: var(--color-text-primary); font-weight: var(--font-weight-bold); }
  .holdings-option[aria-selected="true"] .holdings-currency { border-color: currentColor; color: inherit; }
  .holdings-option-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .holdings-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .holdings-chart-card { min-width: 0; }
  .holdings-ticker {
    padding: 0; border: 0; background: none; color: var(--color-text-primary); cursor: pointer;
    font-family: var(--font-mono); font-size: var(--font-size-md); font-weight: var(--font-weight-bold);
    letter-spacing: 0.02em;
  }
  .holdings-ticker:hover { text-decoration: underline; text-underline-offset: 3px; }
  .holdings-state {
    grid-column: 1 / -1; min-height: 260px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: var(--space-3); padding: var(--space-6);
    border: 1px solid var(--color-divider); border-radius: var(--radius-lg);
    text-align: center; color: var(--color-text-secondary); font-size: var(--font-size-sm);
  }
  .holdings-state p { margin: 0; overflow-wrap: anywhere; }
  .holdings-portfolio-tab:focus-visible, .holdings-dropdown:focus-visible, .holdings-option:focus-visible,
  .holdings-ticker:focus-visible, .holdings-chart-card .card-btn:focus-visible {
    outline: 2px solid var(--color-text-primary); outline-offset: 2px;
  }
  @media (max-width: 1200px) { .holdings-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 768px) {
    .holdings-grid { grid-template-columns: minmax(0, 1fr); }
    .holdings-selector { position: relative; flex-direction: column; align-items: stretch; gap: var(--space-2); padding-bottom: var(--space-3); }
    .holdings-portfolio-tabs { display: none; }
    .holdings-dropdown { display: flex; }
    .holdings-chart-card .card-btn { width: 44px; height: 44px; }
    .holdings-ticker { min-height: 44px; }
  }

  /* ── Chart Card ── */
  .chart-card {
    background: var(--color-bg-elevated);
    border-radius: var(--radius-lg);
    border: 1px solid var(--color-divider);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: box-shadow var(--duration-normal) var(--ease-out);
    min-height: 300px;
  }
  .chart-card:hover { box-shadow: var(--shadow-md); }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--space-3) var(--space-4);
    border-bottom: 1px solid var(--color-divider);
    min-height: 48px;
  }
  .card-left {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    flex: 1;
    min-width: 0;
  }

  .ticker-input {
    font-size: var(--font-size-md);
    font-weight: var(--font-weight-bold);
    color: var(--color-text-primary);
    background: transparent;
    border: none;
    outline: none;
    width: auto;
    min-width: 60px;
    max-width: 120px;
    text-transform: uppercase;
    -webkit-text-transform: uppercase;
  }
  .ticker-input::placeholder { color: var(--color-text-tertiary); font-weight: var(--font-weight-medium); }
  .ticker-input:focus { outline: 2px solid var(--color-primary); outline-offset: 2px; border-radius: var(--radius-sm); }

  .price-block {
    display: flex;
    align-items: baseline;
    gap: var(--space-2);
    flex-shrink: 0;
    white-space: nowrap;
  }
  .price-val {
    font-size: var(--font-size-sm);
    font-weight: var(--font-weight-semibold);
    font-family: var(--font-mono);
    color: var(--color-text-primary);
    white-space: nowrap;
  }
  .price-val.up { color: var(--color-stock-up); }
  .price-val.dn { color: var(--color-stock-down); }
  .price-chg {
    font-size: var(--font-size-xs);
    font-weight: var(--font-weight-medium);
    padding: 1px var(--space-1);
    border-radius: var(--radius-sm);
    white-space: nowrap;
  }
  .price-chg.up { color: var(--color-stock-up); background: var(--color-success-subtle); }
  .price-chg.dn { color: var(--color-stock-down); background: var(--color-error-subtle); }

  .card-right {
    display: flex;
    align-items: center;
    gap: var(--space-1);
    flex-shrink: 0;
  }
  .card-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: var(--radius-sm);
    color: var(--color-text-secondary);
    transition: all var(--duration-fast) var(--ease-out);
    font-size: var(--font-size-sm);
    border: none;
    background: none;
    cursor: pointer;
  }
  .card-btn:hover { background: var(--color-bg-subtle); color: var(--color-text-primary); }
  .card-btn:active { background: var(--color-primary-muted); }
  .card-btn:focus-visible { outline: 2px solid var(--color-text-primary); outline-offset: 2px; }
  .card-btn svg { width: 18px; height: 18px; flex: none; }
  .card-btn.sr-active { background: var(--color-primary-subtle); color: var(--color-primary); }
  .card-btn[data-action="delete"]:hover { background: var(--color-error-subtle); color: var(--color-error); }

  /* Card Body */
  .card-body {
    flex: 1;
    position: relative;
    min-height: 260px;
    background: var(--color-bg);
  }
  .tv-chart-wrap {
    width: 100%;
    height: 100%;
    position: absolute;
    inset: 0;
  }

  .grid-pattern-toggle {
    position: absolute;
    z-index: 4;
    top: 10px;
    left: 10px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    padding: 0;
    color: var(--color-primary);
    background: var(--color-bg-elevated);
    border: 1px solid var(--color-divider);
    border-radius: var(--radius-sm);
    cursor: pointer;
  }
  .grid-pattern-toggle[hidden],
  .grid-pattern-toggle[aria-pressed="true"] .eye-closed,
  .grid-pattern-toggle[aria-pressed="false"] .eye-open { display: none; }
  .grid-pattern-toggle svg { width: 18px; height: 18px; }
  .grid-pattern-toggle:hover { background: var(--color-bg-subtle); }
  .grid-pattern-toggle:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
  @media (max-width: 767px) {
    .grid-pattern-toggle { width: 44px; height: 44px; }
  }

  .draw-hint {
    position: absolute;
    bottom: var(--space-2);
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    font-weight: var(--font-weight-medium);
    color: var(--color-text-tertiary);
    background: var(--color-bg-elevated);
    padding: var(--space-1) var(--space-2);
    border-radius: var(--radius-sm);
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--duration-fast) var(--ease-out);
    white-space: nowrap;
    z-index: 10;
  }
  .card-body.draw-mode .draw-hint { opacity: 1; }
  .card-body.draw-mode { cursor: crosshair; }

  /* Card Status */
  .card-status {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--space-2);
    background: var(--color-bg);
    z-index: 5;
  }
  .card-status.hidden { display: none; }

  .card-btn[data-action="reload"] svg {
    width: 14px;
    height: 14px;
  }

  /* Empty card */
  .chart-card.empty .card-header { border-bottom: none; }
  .chart-card.empty .card-body {
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--color-text-tertiary);
    font-size: var(--font-size-sm);
  }

  /* ── S/R Picker Popup ── */
  .sr-picker {
    position: fixed;
    background: var(--color-bg-elevated);
    border: 1px solid var(--color-divider);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-lg);
    padding: var(--space-3);
    z-index: 3000;  /* Must be above expand-modal (2000) */
    display: flex;
    align-items: center;
    gap: var(--space-2);
    white-space: nowrap;
  }
  .sr-picker-price {
    font-size: var(--font-size-sm);
    font-weight: var(--font-weight-semibold);
    font-family: var(--font-mono);
    color: var(--color-text-primary);
    margin-right: var(--space-2);
  }
  .sr-picker-btn {
    padding: var(--space-2) var(--space-3);
    border-radius: var(--radius-sm);
    font-size: var(--font-size-sm);
    font-weight: var(--font-weight-medium);
    transition: all var(--duration-fast) var(--ease-out);
    cursor: pointer;
    border: none;
  }
  .sr-picker-btn.sup {
    color: var(--color-chart-support, var(--color-success));
    background: var(--color-success-subtle);
  }
  .sr-picker-btn.sup:hover {
    background: var(--color-chart-support, var(--color-success));
    color: var(--color-text-inverse);
  }
  .sr-picker-btn.res {
    color: var(--color-chart-resistance, var(--color-error));
    background: var(--color-error-subtle);
  }
  .sr-picker-btn.res:hover {
    background: var(--color-chart-resistance, var(--color-error));
    color: var(--color-text-inverse);
  }
  .sr-picker-cancel {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    border-radius: var(--radius-full);
    color: var(--color-text-tertiary);
    font-size: var(--font-size-sm);
    border: none;
    background: none;
    cursor: pointer;
  }
  .sr-picker-cancel:hover { background: var(--color-bg-subtle); color: var(--color-text-primary); }
  .lc-tracking-tooltip {
    position: absolute; display: none;
    padding: 8px 12px;
    background: var(--color-bg-elevated);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow-md);
    pointer-events: none; z-index: 10;
    font-family: var(--font-mono); font-size: var(--font-size-xs); line-height: 1.25; white-space: nowrap;
  }
  .lc-tt-price { font-family: var(--font-mono); font-size: 18px; font-weight: 600; margin: 1px 0; color: var(--color-text-primary); }
  .lc-tt-time  { color: var(--color-text-primary); font-size: var(--font-size-xs); }
  .lc-tt-volume { color: var(--color-text-primary); font-size: 11px; margin-top: 1px; }

  /* ── Add Chart Modal ── */
  .add-chart-modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 2000;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity var(--duration-slow) var(--ease-out);
    backdrop-filter: blur(4px);
  }
  .add-chart-modal.open { opacity: 1; pointer-events: auto; }

  .add-chart-content {
    width: 400px;
    background: var(--color-bg-elevated);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    padding: var(--space-6);
    transform: scale(0.95);
    transition: transform var(--duration-slow) var(--ease-out);
  }
  .add-chart-modal.open .add-chart-content { transform: scale(1); }

  .add-chart-title {
    font-size: var(--font-size-lg);
    font-weight: var(--font-weight-semibold);
    color: var(--color-text-primary);
    margin-bottom: var(--space-4);
  }
  .add-chart-input {
    width: 100%;
    padding: var(--space-3);
    font-size: var(--font-size-md);
    font-weight: var(--font-weight-medium);
    background: var(--color-bg-subtle);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    color: var(--color-text-primary);
    text-transform: uppercase;
    margin-bottom: var(--space-2);
    outline: none;
  }
  .add-chart-input:focus { border-color: var(--color-primary); }
  .add-chart-input::placeholder { color: var(--color-text-tertiary); text-transform: none; }

  .add-chart-error {
    font-size: var(--font-size-sm);
    color: var(--color-error);
    margin-bottom: var(--space-3);
    min-height: 20px;
  }
  .add-chart-actions {
    display: flex;
    justify-content: flex-end;
    gap: var(--space-2);
  }
  .add-chart-cancel {
    padding: var(--space-2) var(--space-4);
    font-size: var(--font-size-sm);
    font-weight: var(--font-weight-medium);
    color: var(--color-text-secondary);
    border-radius: var(--radius-sm);
    transition: all var(--duration-fast) var(--ease-out);
    border: none;
    background: none;
    cursor: pointer;
  }
  .add-chart-cancel:hover { background: var(--color-bg-subtle); color: var(--color-text-primary); }

  .add-chart-submit {
    padding: var(--space-2) var(--space-4);
    font-size: var(--font-size-sm);
    font-weight: var(--font-weight-medium);
    background: var(--color-primary);
    color: var(--color-text-inverse);
    border-radius: var(--radius-sm);
    transition: background var(--duration-fast) var(--ease-out);
    border: none;
    cursor: pointer;
  }
