  <!-- Like LIFT, iPhone chrome follows system appearance, not the in-app toggle. -->
  <meta name="theme-color" content="#F3F6FB" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101927" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <script>
    // Restore the theme before the first paint, including the iPhone safe area.
    (() => {
      if (navigator.standalone === true || matchMedia('(display-mode: standalone)').matches) {
        document.documentElement.classList.add('standalone-app');
      }
      let theme;
      try { theme = localStorage.getItem('investingview-theme'); } catch (_) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme;
    })();
  </script>

  <!-- ═══ ALERTS SLIDE-IN PANEL (Global — persists across all screens) ═══ -->
  <style>
    /* ─── ALERTS SLIDE-IN PANEL ─── */
    .alerts-panel-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 1100;
      display: none;
      opacity: 0;
      transition: opacity var(--duration-normal) var(--ease-out);
    }
    .alerts-panel-backdrop.open { display: block; opacity: 1; }
    .alerts-panel {
      position: fixed;
      top: 0;
      right: -400px;
      width: 380px;
      height: 100vh;
      background: var(--color-bg-elevated);
      border-left: 1px solid var(--color-border);
      box-shadow: var(--shadow-xl);
      z-index: 1101;
      display: flex;
      flex-direction: column;
      transition: right var(--duration-slow) var(--ease-spring);
    }
    .alerts-panel.open { right: 0; }
    .alerts-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-5) var(--space-6);
      border-bottom: 1px solid var(--color-divider);
      flex-shrink: 0;
    }
    .alerts-panel-header h3 {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-text-secondary);
      margin: 0;
    }
    .alerts-panel-close {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-sm);
      color: var(--color-text-secondary);
      transition: background var(--duration-fast);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 18px;
    }
    .alerts-panel-close:hover { background: var(--color-bg-subtle); }
    .alerts-panel-body {
      flex: 1;
      overflow-y: auto;
      padding: var(--space-4) var(--space-6);
    }
    .alert-item {
      display: flex;
      align-items: flex-start;
      gap: var(--space-3);
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-sm);
      margin-bottom: var(--space-2);
      transition: background var(--duration-fast);
    }
    .alert-item:hover { background: var(--color-bg-subtle); }
    .alert-item-dot {
      width: 8px;
      height: 8px;
      border-radius: var(--radius-full);
      flex-shrink: 0;
      margin-top: 6px;
    }
    .alert-item-dot.active { background: var(--color-success); }
    .alert-item-dot.triggered { background: var(--color-warning); }
    .alert-item-content { flex: 1; min-width: 0; }
    .alert-item-ticker { font-family: var(--font-mono); font-weight: var(--font-weight-semibold); font-size: var(--font-size-sm); color: var(--color-text-primary); }
    .alert-item-desc { font-size: var(--font-size-xs); color: var(--color-text-secondary); margin-top: 2px; }
    .alert-item-time { font-size: var(--font-size-xs); color: var(--color-text-tertiary); white-space: nowrap; }
    .alerts-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: var(--space-12) var(--space-6); text-align: center; }
    .alerts-empty svg { width: 32px; height: 32px; color: var(--color-text-tertiary); margin-bottom: var(--space-3); }
    .alerts-empty p { font-size: var(--font-size-sm); color: var(--color-text-tertiary); }
    .alerts-panel-actions {
      display: flex;
      gap: var(--space-2);
      padding: var(--space-5) var(--space-6) var(--space-3);
      border-bottom: 1px solid var(--color-divider);
      flex-shrink: 0;
    }
    .alerts-check-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-3);
      min-height: 36px;
      border-radius: var(--radius-sm);
      font-family: var(--font-mono);
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-medium);
      border: 1px solid var(--color-border);
      background: var(--color-bg);
      color: var(--color-text-secondary);
      cursor: pointer;
      transition: all var(--duration-fast);
    }
    .alerts-check-btn:hover { background: var(--color-bg-subtle); color: var(--color-text-primary); border-color: var(--color-text-tertiary); }
    .alerts-check-btn svg { width: 14px; height: 14px; }
    .alert-item-history {
      display: flex;
      align-items: flex-start;
      gap: var(--space-3);
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-sm);
      margin-bottom: var(--space-2);
      border-left: 3px solid var(--color-border);
      transition: background var(--duration-fast);
    }
    .alert-item-history:hover { background: var(--color-bg-subtle); }
    .alert-item-history .alert-item-icon { font-size: 14px; flex-shrink: 0; margin-top: 2px; }
    .alert-item-history .alert-item-info { flex: 1; min-width: 0; }
    .alert-item-history .alert-item-ticker { font-family: var(--font-mono); font-weight: var(--font-weight-semibold); font-size: var(--font-size-sm); }
    .alert-item-history .alert-item-desc { font-size: var(--font-size-xs); color: var(--color-text-secondary); margin-top: 2px; }
    .alert-item-history .alert-item-time { font-size: 10px; color: var(--color-text-tertiary); white-space: nowrap; }
    .alert-item-history.up { border-left-color: #34C759; }
    .alert-item-history.down { border-left-color: #FF3B30; }
    .alerts-status-msg {
      font-size: var(--font-size-xs);
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-sm);
      margin-bottom: var(--space-2);
    }
    .alerts-status-msg.ok { color: #34C759; background: rgba(52,199,89,0.08); }
    .alerts-status-msg.err { color: #FF3B30; background: rgba(255,59,48,0.08); }

    @media (prefers-reduced-motion: reduce) {
      .alerts-panel, .alerts-panel-backdrop { transition-duration: 0.01ms !important; }
    }
  </style>

  <div class="alerts-panel-backdrop" id="alerts-backdrop" aria-hidden="true"></div>
  <div class="alerts-panel" id="alerts-panel" role="dialog" aria-label="Alerts panel">
    <div class="alerts-panel-header">
      <h3>Alerts</h3>
      <button class="alerts-panel-close" id="alerts-close" aria-label="Close alerts">&times;</button>
    </div>

      <button class="alerts-check-btn" id="alerts-clear" aria-label="Clear all notifications">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 4l8 8M12 4l-8 8"/></svg>
        Clear All
      </button>
    </div>
    <div class="alerts-panel-body" id="alerts-panel-body">
      <div class="alerts-empty" id="alerts-empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <p>No alerts fired yet</p>
      </div>
    </div>
  </div>
